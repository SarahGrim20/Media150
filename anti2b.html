        body {text-align: center;

        /* The container holds the image and text together */
        .container {
            position: relative;
            display: inline-block; /* Keeps the container the same size as the image */
            color: rgb(219, 39, 39);          /* text color */
            font-family: Arial, sans-serif;
        }

        /* Positions the text "on top" of the image */
        .text1 {
            position: absolute;
            background-color: azure;
            padding:10px 15px;
            border:2px solid black;
            border-radius:8px;
            top: 10%; /*change this number to move vertically*/
            left: 70%;/*change this number to move horizontally*/
            transform: translate(-50%, -50%);
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(255, 0, 0, 0.7); /* Makes text readable on any image */
        }
